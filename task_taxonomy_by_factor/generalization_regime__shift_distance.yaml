- task_id: random_label
  value: none; evaluation sits inside the training support
  summary: With both sides drawn identically from a support of four instances, evaluation
    is not out of distribution in any respect, and performance still cannot exceed one half.
- task_id: relabeled_cyclic_row_completion
  value: none between training and evaluation; the settings form a graded ladder
  summary: Both sides are drawn identically, so the only designed distance is the gap from
