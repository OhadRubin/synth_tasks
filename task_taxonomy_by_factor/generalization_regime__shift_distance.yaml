- task_id: year_span_greater_than
  value: none between training and evaluation; the settings sit at increasing distances from
    the decision boundary
  summary: Both sides are drawn identically at every setting. The designed distance runs the
    other way from the usual ladder, since the hardest setting is the one closest to where
    the answer would flip, at a difference of a single year.
