- task_id: majority
  value: training and evaluation sequences are drawn identically within a setting
  summary: Nothing about the construction differs between the two sides; they differ only
    in which random sequences come out.
- task_id: markov_first_rewrite
  value: training and evaluation instances are drawn the same way within a setting
  summary: The construction, the rejection rules, and the proportion of nothing-applies instances
